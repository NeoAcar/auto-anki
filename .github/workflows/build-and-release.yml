name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test AutoAnki.sln -c Release

      - name: Publish Windows executable
        shell: pwsh
        run: >-
          dotnet publish src/AutoAnki.App/AutoAnki.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o artifacts/publish

      - name: Upload ready-to-run executable
        uses: actions/upload-artifact@v7
        with:
          name: AutoAnki-win-x64
          path: artifacts/publish/AutoAnki.exe

      - name: Package tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: .\scripts\package-release.ps1 -Version "${{ github.ref_name }}" -SkipBuild

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          "artifacts/release/AutoAnki-${{ github.ref_name }}-win-x64.zip"
          "artifacts/release/AutoAnki-${{ github.ref_name }}-win-x64.zip.sha256"
          "artifacts/publish/AutoAnki.exe"
          --title "AutoAnki ${{ github.ref_name }}"
          --generate-notes
